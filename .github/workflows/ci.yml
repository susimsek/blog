name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.7.0"

jobs:
  verify:
    name: Tests, analysis, and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Go modules
        run: go mod download

      - name: Detect optional scan credentials
        id: scan-credentials
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SNYK_TOKEN" ]]; then
            echo "snyk=true" >> "$GITHUB_OUTPUT"
          else
            echo "snyk=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Snyk CLI
        if: steps.scan-credentials.outputs.snyk == 'true'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Run Snyk scan
        if: steps.scan-credentials.outputs.snyk == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --exclude=go.mod

      - name: Run frontend tests
        run: pnpm test

      - name: Run backend lint
        env:
          GOTOOLCHAIN: auto
        run: pnpm run backend:lint:report

      - name: Run backend tests
        run: pnpm run backend:ci

      - name: Run SonarCloud analysis
        if: steps.scan-credentials.outputs.sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build static site
        run: pnpm run build

      - name: Upload static site for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: build/
          if-no-files-found: error
          retention-days: 1
